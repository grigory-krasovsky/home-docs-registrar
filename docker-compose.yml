# Runs on the VPS. Secrets come from a .env file next to this file (never commit .env).
# Deploy sets SERVER_IMAGE to the freshly pushed GHCR tag; otherwise :latest is used.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_docs}
      POSTGRES_USER: ${POSTGRES_USER:-home_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only, for admin access (e.g. IDE DB tools) over an SSH tunnel to the VPS.
      # Never bind this to 0.0.0.0 — Postgres would otherwise be reachable from the internet.
      # Host side defaults to 5433, not 5432: this VPS is shared and something else already
      # holds 5432 on the host (same reason the server port defaults to 8081, not 8080).
      # Override with DB_ADMIN_PORT in .env if 5433 is also taken.
      - "127.0.0.1:${DB_ADMIN_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-home_docs} -d ${POSTGRES_DB:-home_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ${SERVER_IMAGE:-ghcr.io/grigory-krasovsky/home-docs-server:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-home_docs}
      DB_USER: ${POSTGRES_USER:-home_docs}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Used from step 3/4 onwards; leave blank in .env until then.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ARCHIVE_CHANNEL_ID: ${ARCHIVE_CHANNEL_ID:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      # Vision extraction (Claude). Blank -> extraction disabled, the app still runs.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Only for identity-linked keys (not workspace-scoped); leave blank otherwise.
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      # Remaining-balance estimate (no balance API). Defaults suit Claude Haiku 4.5; see application.yaml.
      ANTHROPIC_POOL_USD: ${ANTHROPIC_POOL_USD:-5.00}
      ANTHROPIC_PRICE_INPUT_PER_MTOK: ${ANTHROPIC_PRICE_INPUT_PER_MTOK:-1.00}
      ANTHROPIC_PRICE_OUTPUT_PER_MTOK: ${ANTHROPIC_PRICE_OUTPUT_PER_MTOK:-5.00}
    ports:
      # Localhost only; this VPS is shared (8080 is taken by another service), so default to 8081.
      # Override with SERVER_HTTP_PORT in .env if needed. Put a TLS reverse proxy in front for the
      # agent API (step 4) — matches the existing 127.0.0.1:<port> + reverse-proxy pattern on this host.
      - "127.0.0.1:${SERVER_HTTP_PORT:-8081}:8080"

volumes:
  pgdata:
