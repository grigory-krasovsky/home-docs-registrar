name: CI/CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/home-docs-server
      # Exposed so the deploy steps can be skipped until the SSH secrets are configured.
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # --- Deploy over SSH with password auth (skipped until the SSH_HOST secret is set) ---

      - name: Copy compose file to the VPS
        if: ${{ env.SSH_HOST != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: docker-compose.yml
          target: ~/home-docs-registrar/

      - name: Deploy on the VPS
        if: ${{ env.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd ~/home-docs-registrar
            export SERVER_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            # ghcr.io from this VPS occasionally fails the TLS handshake; retry login+pull with backoff
            # so a transient timeout doesn't fail the whole deploy. A persistent failure still exits 1.
            attempt=0; max=5
            until [ "$attempt" -ge "$max" ]; do
              if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin && docker compose pull; then
                break
              fi
              attempt=$((attempt + 1))
              echo "GHCR login/pull failed (attempt $attempt/$max) — retrying in $((attempt * 15))s…"
              sleep $((attempt * 15))
            done
            if [ "$attempt" -ge "$max" ]; then
              echo "ERROR: could not reach ghcr.io after $max attempts (TLS handshake timeout). This is a VPS→ghcr.io network issue, not the build."
              exit 1
            fi
            docker compose up -d
