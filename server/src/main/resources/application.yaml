spring:
  application:
    name: home-docs-registrar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/home_docs}
    username: ${DB_USER:home_docs}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema now (see src/main/resources/db/migration + spring.flyway below);
      # Hibernate only maps onto it, it neither creates nor validates.
      ddl-auto: none
  flyway:
    # The live database predates Flyway: on a non-empty schema baseline V1 (its create-tables) as
    # already-applied, then run forward migrations (V2 = FTS). A fresh database runs V1 then V2.
    baseline-on-migrate: true
    baseline-version: 1

telegram:
  # Blank when unset -> the bot is disabled but the app still boots (see TelegramBotConfig).
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  archive-channel-id: ${ARCHIVE_CHANNEL_ID:}
  # How long to wait (ms) after the last album page before treating a multi-page album as complete.
  media-group-debounce-ms: ${TELEGRAM_MEDIA_GROUP_DEBOUNCE_MS:1500}

anthropic:
  # Vision extraction. Blank key -> the service is disabled and the app still boots (tests/no-key runs).
  api-key: ${ANTHROPIC_API_KEY:}
  # Required only for identity-linked API keys (not scoped to a workspace); leave blank for a
  # workspace-scoped key. When set, sent as the anthropic-workspace-id header on every request.
  workspace-id: ${ANTHROPIC_WORKSPACE_ID:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  # Remaining-balance estimate for the bot (/tokens + per-recognition status). There is no balance API,
  # so this is an estimate: the local token counter (spend since it was deployed) times the prices below.
  # pool-usd = the prepaid credit to count down from (0 -> no % shown); set it to your current Console
  # balance for the closest estimate. Prices default to Claude Haiku 4.5 ($1 in / $5 out per 1M tokens) —
  # update them if you change anthropic.model.
  pool-usd: ${ANTHROPIC_POOL_USD:5.00}
  price:
    input-per-mtok: ${ANTHROPIC_PRICE_INPUT_PER_MTOK:1.00}
    output-per-mtok: ${ANTHROPIC_PRICE_OUTPUT_PER_MTOK:5.00}

search:
  # Expand a search query into related Russian terms via Claude before the FTS lookup, so e.g. «свадьба»
  # also matches «свидетельство о браке». Adds one cheap Haiku call per search; set false for plain FTS.
  expand-query: ${SEARCH_EXPAND_QUERY:true}
  # When a search falls back to LLM query expansion, drop results whose relevance (ts_rank) is below this
  # fraction of the top hit — so one broad synonym can't pull in unrelated documents that merely share a
  # common word. 0 keeps everything (old behaviour); higher = stricter. Tune against real data.
  expand-rank-floor: ${SEARCH_EXPAND_RANK_FLOOR:0.3}

qa:
  # Answer free-text questions over the archive (/ask): retrieve the relevant documents via search, then
  # ground a Haiku call on their text to answer with citations. Adds one Haiku call per question (on top
  # of retrieval); set false to disable /ask (the bot then says Q&A is unavailable).
  enabled: ${QA_ENABLED:true}

sections:
  # After recognition, suggest which card-catalog subsection a document belongs to with a cheap Haiku
  # text call (no image). The user confirms or overrides in the chat. Set false to only show the picker.
  suggest: ${SECTIONS_SUGGEST:true}

notifier:
  # Reminders live in the sibling notifier bot (its HTTP API v1; see docs/PLAN.md). Blank url -> the
  # integration is off: no reminder buttons or suggestions, and the app boots as usual. On the VPS both apps
  # share the external docker network «home-apps», so this is http://notifier-app:8080 there.
  url: ${NOTIFIER_URL:}
  # Bearer token; must equal NOTIFIER_API_TOKEN in notifier's .env. Env only — never in git.
  api-token: ${NOTIFIER_API_TOKEN:}
  # The notifier bot's @username, for the «запусти @… и нажми /start» hint when a user isn't connected yet.
  bot-username: ${NOTIFIER_BOT_USERNAME:}
  # Short on purpose (same host): past these the user is told notifier didn't answer and can tap again.
  connect-timeout: 2s
  read-timeout: 5s

reminders:
  # Ask the recognition (vision) call for the document's upcoming deadlines (warranty end, next service,
  # contract/insurance end, payment due) and offer them as reminders on the saved card. Rides on the
  # existing call (no extra request; a few dozen tokens more); only active when notifier.url is set.
  suggest: ${REMINDERS_SUGGEST:true}
  # «Today» for validating suggested dates when the user's timezone isn't known from notifier.
  default-zone: ${REMINDERS_DEFAULT_ZONE:Europe/Moscow}
