spring:
  application:
    name: home-docs-registrar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/home_docs}
    username: ${DB_USER:home_docs}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # MVP: let Hibernate manage the schema. Postgres-specific FTS (tsvector + GIN) is added
      # separately in step 3; consider switching to Flyway migrations then.
      ddl-auto: update

telegram:
  # Blank when unset -> the bot is disabled but the app still boots (see TelegramBotConfig).
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  archive-channel-id: ${ARCHIVE_CHANNEL_ID:}

anthropic:
  # Vision extraction. Blank key -> the service is disabled and the app still boots (tests/no-key runs).
  api-key: ${ANTHROPIC_API_KEY:}
  # Required only for identity-linked API keys (not scoped to a workspace); leave blank for a
  # workspace-scoped key. When set, sent as the anthropic-workspace-id header on every request.
  workspace-id: ${ANTHROPIC_WORKSPACE_ID:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  # Remaining-balance estimate for the bot (/tokens + per-recognition status). There is no balance API,
  # so this is an estimate: the local token counter (spend since it was deployed) times the prices below.
  # pool-usd = the prepaid credit to count down from (0 -> no % shown); set it to your current Console
  # balance for the closest estimate. Prices default to Claude Haiku 4.5 ($1 in / $5 out per 1M tokens) —
  # update them if you change anthropic.model.
  pool-usd: ${ANTHROPIC_POOL_USD:5.00}
  price:
    input-per-mtok: ${ANTHROPIC_PRICE_INPUT_PER_MTOK:1.00}
    output-per-mtok: ${ANTHROPIC_PRICE_OUTPUT_PER_MTOK:5.00}
