spring:
  application:
    name: home-docs-registrar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/home_docs}
    username: ${DB_USER:home_docs}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # MVP: let Hibernate manage the schema. Postgres-specific FTS (tsvector + GIN) is added
      # separately in step 3; consider switching to Flyway migrations then.
      ddl-auto: update

telegram:
  # Blank when unset -> the bot is disabled but the app still boots (see TelegramBotConfig).
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  archive-channel-id: ${ARCHIVE_CHANNEL_ID:}

ocr:
  # Tesseract language data path inside the Docker image.
  data-path: ${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
  # rus+eng: documents mix Cyrillic and Latin (emails, model numbers), which reduces misreads.
  language: ${OCR_LANGUAGE:rus+eng}
  # Tesseract page segmentation mode (3 = automatic).
  page-seg-mode: ${OCR_PSM:3}
